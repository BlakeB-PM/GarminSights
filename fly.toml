app = 'garminsights'
primary_region = 'dfw'

[build]

[env]
  ENV = 'production'
  DATABASE_PATH = '/data/fitness.db'
  GARTH_TOKENS_PATH = '/data/.garth_tokens'
  CORS_ORIGINS = '["https://garminsights.blakebeal.com"]'

[mounts]
  source = 'garminsights_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # 'suspend' (vs 'stop') resumes the machine from a memory snapshot in well
  # under a second instead of a 15-30s full cold boot. That cold boot made the
  # post-login redirect from Cloudflare Access hang on a seemingly frozen code
  # page — users would click Verify a second time and consume their one-time
  # PIN twice ("This One-Time PIN has already been used").
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '45s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
